name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  prettier-format-check:
    name: Check
    uses: bymbly/gha-workflows/.github/workflows/prettier-format-check.yaml@02d8a125e93ddc2e3292d7f8a3fac595e0d2a2fb # main

  eslint-lint-check:
    name: Check
    uses: bymbly/gha-workflows/.github/workflows/eslint-lint-check.yaml@02d8a125e93ddc2e3292d7f8a3fac595e0d2a2fb # main

  markdown-lint-check:
    name: Check
    uses: bymbly/gha-workflows/.github/workflows/markdown-lint-check.yaml@02d8a125e93ddc2e3292d7f8a3fac595e0d2a2fb # main

  stylelint-lint-check:
    name: Check / Stylelint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bymbly/gha-workflows/.github/actions/setup-node@02d8a125e93ddc2e3292d7f8a3fac595e0d2a2fb # main
        with:
          cache: "npm"
      - run: npm ci
      - run: npx stylelint "**/*.css"

  astro-check:
    name: Check / Astro Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bymbly/gha-workflows/.github/actions/setup-node@02d8a125e93ddc2e3292d7f8a3fac595e0d2a2fb # main
        with:
          cache: "npm"
      - run: npm ci
      - run: npx astro check

  deploy:
    name: Deploy
    needs:
      [
        prettier-format-check,
        eslint-lint-check,
        markdown-lint-check,
        stylelint-lint-check,
        astro-check,
      ]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bymbly/gha-workflows/.github/actions/setup-node@02d8a125e93ddc2e3292d7f8a3fac595e0d2a2fb # main
        with:
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@4e88846969242f7752bcfdaf5511bfbb3985ca47 # v4.1.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
