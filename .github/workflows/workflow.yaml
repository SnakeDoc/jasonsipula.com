name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  prettier-format-check:
    name: Check
    uses: bymbly/gha-workflows/.github/workflows/prettier-format-check.yaml@ed259e667c856656cf42b8b33be10e21c2d3d629 # main

  eslint-lint-check:
    name: Check
    uses: bymbly/gha-workflows/.github/workflows/eslint-lint-check.yaml@ed259e667c856656cf42b8b33be10e21c2d3d629 # main

  markdown-lint-check:
    name: Check
    uses: bymbly/gha-workflows/.github/workflows/markdown-lint-check.yaml@ed259e667c856656cf42b8b33be10e21c2d3d629 # main

  stylelint-lint-check:
    name: Check / Stylelint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: bymbly/gha-workflows/.github/actions/setup-node@ed259e667c856656cf42b8b33be10e21c2d3d629 # main
        with:
          cache: "npm"
      - run: npm ci
      - run: npx stylelint "**/*.css"

  astro-check:
    name: Check / Astro Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: bymbly/gha-workflows/.github/actions/setup-node@ed259e667c856656cf42b8b33be10e21c2d3d629 # main
        with:
          cache: "npm"
      - run: npm ci
      - run: npx astro check

  deploy:
    name: Deploy
    needs:
      [
        prettier-format-check,
        eslint-lint-check,
        markdown-lint-check,
        stylelint-lint-check,
        astro-check,
      ]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: bymbly/gha-workflows/.github/actions/setup-node@ed259e667c856656cf42b8b33be10e21c2d3d629 # main
        with:
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
